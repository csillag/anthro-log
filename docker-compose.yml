services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    container_name: anthro-log-otel
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus scrape (internal)
      - "13133:13133" # health_check

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: anthro-log-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=180d"
      - "--web.enable-lifecycle"
    volumes:
      # Mount the directory (not the single file) so editor-style atomic
      # rewrites of prometheus.yml are visible without restarting the
      # container. Reload via: curl -X POST http://localhost:9090/-/reload
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  usage-poller:
    build: ./usage-poller
    container_name: anthro-log-usage-poller
    restart: unless-stopped
    # Pin public resolvers so outbound DNS survives host-network changes
    # (Docker daemon snapshots host /etc/resolv.conf at daemon-start time;
    # without this, switching LANs strands the embedded resolver on a
    # stale upstream and api.anthropic.com lookups fail.)
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - POLL_INTERVAL_SECONDS=${USAGE_POLL_INTERVAL_SECONDS:-900}
      - HTTP_PORT=9092
      - CLAUDE_USAGE_BIN=/opt/claude-usage/claude-usage
    volumes:
      # Bind-mount the claude-usage CLI so updates land without rebuilding.
      - ${CLAUDE_USAGE_WATCHER_DIR:-../claude-usage-watcher}/bin:/opt/claude-usage:ro
      # Bind-mount the whole ~/.claude dir (NOT just .credentials.json) so the
      # CLI's atomic refresh-and-rewrite stays on the same filesystem as the
      # target file. Read-write because the access token periodically rotates.
      - ${HOME}/.claude:/home/poller/.claude
    ports:
      - "9092:9092"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: anthro-log-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
